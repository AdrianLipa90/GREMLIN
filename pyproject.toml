[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gremlin-mcp"
version = "0.5.0"
description = "Standalone Model Context Protocol adapter for the GREMLIN Bestiary"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Adrian Lipa / Intention Lab" }
]
dependencies = [
  "mcp>=2,<3",
  "cryptography>=42,<47",
  "tomli>=2,<3; python_version < '3.11'"
]

[project.scripts]
gremlin-mcp = "gremlin_mcp.server_with_hive:main"
gremlin-hive-mcp = "gremlin_mcp.hive_server:main"
gremlin-product-mcp = "gremlin_mcp.product_server:main"
gremlin-license = "gremlin_mcp.product.cli:main"
gremlin-bundle = "gremlin_mcp.product.bundle_cli:main"
gremlinctl = "gremlin_mcp.install.cli:main"

[tool.setuptools.packages.find]
include = ["gremlin_mcp*", "tools*"]
namespaces = true

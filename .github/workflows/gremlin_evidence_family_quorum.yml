name: GREMLIN Evidence Family Quorum

on:
  push:
    branches:
      - feat/gremlin-evidence-family-quorum-v0.1
  pull_request:
    branches:
      - feat/gremlin-external-research-eval-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-family-quorum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GREMLIN and test dependency
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run family quorum unit tests
        run: python -m pytest -q tests/test_evidence_quorum.py
      - name: Run strict semantic quorum integration tests
        run: python -m pytest -q tests/test_semantic_quorum_bridge.py
      - name: Run existing semantic bridge regression tests
        run: python -m pytest -q tests/test_semantic_bridge.py tests/test_source_family.py tests/test_semantic_evidence.py
      - name: Import strict quorum MCP entrypoint
        run: python -c "import gremlin_mcp.quorum_server as q; assert callable(q.gremlin_evidence_family_quorum); assert callable(q.gremlin_semantic_quorum_apply)"
      - name: Generate deterministic family quorum receipt
        run: python -m tools.gremlin_evidence_family_quorum_probe_v01 --out artifacts/gremlin_evidence_family_quorum_probe.json
      - name: Verify preregistered family quorum gates
        run: python -c "import json; r=json.load(open('artifacts/gremlin_evidence_family_quorum_probe.json')); assert r['status']=='PASS'; assert all(r['checks'].values()); assert r['leaderboard_or_external_benchmark_claimed'] is False"
      - name: Upload family quorum receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-evidence-family-quorum
          path: artifacts/gremlin_evidence_family_quorum_probe.json
          if-no-files-found: warn

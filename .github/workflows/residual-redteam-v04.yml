name: residual-redteam-v04

on:
  push:
    branches:
      - audit/residual-redteam-v04-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Pin pre-fix failure reproducers
        run: python -m pytest -q tests/redteam/test_residual_v03_prefx_failures.py
      - name: Residual spectroscopy v0.4
        run: python -m pytest -q tests/redteam/test_residual_spectroscopy_v04.py
      - name: Recursive residual v0.4
        run: python -m pytest -q tests/redteam/test_recursive_residual_v04.py

name: GREMLIN KAKU Radical Writer v0.1

on:
  push:
    branches:
      - feat/gremlin-kaku-radical-pnv-writer-v0.1
  pull_request:
    paths:
      - 'tools/gremlin_kaku_radical_writer_v01.py'
      - 'tools/gremlin_kaku_radical_store_v01.py'
      - 'tools/gremlin_radical_ethics_acquisition_v01.py'
      - 'tools/gremlin_kaku_scalar_acquisition_v01.py'
      - 'tools/gremlin_kaku_radical_scalar_plane_v01.py'
      - 'native/GREMLIN_KAKU_RADICAL_WRITER_V0_1.pnv'
      - 'tests/test_gremlin_kaku_radical_writer_v01.py'
      - 'tests/test_gremlin_radical_ethics_acquisition_v01.py'
      - 'tests/test_gremlin_kaku_scalar_acquisition_v01.py'
      - 'tests/test_native_pnv_contracts.py'
      - 'spec/GREMLIN_KAKU_RADICAL_WRITER_V0_1.md'
      - '.github/workflows/gremlin-kaku-radical-writer-v01.yml'

jobs:
  kaku-radical-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Run writer, acquisition and native contracts
        run: >-
          python -m pytest -q
          tests/test_gremlin_kaku_radical_writer_v01.py
          tests/test_gremlin_radical_ethics_acquisition_v01.py
          tests/test_gremlin_kaku_scalar_acquisition_v01.py
          tests/test_native_pnv_contracts.py

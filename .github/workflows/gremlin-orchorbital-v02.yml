name: GREMLIN Orchorbital Runtime v0.2

on:
  pull_request:
    paths:
      - 'gremlin_mcp/role_registry.py'
      - 'gremlin_mcp/orchorbital_fabric.py'
      - 'gremlin_mcp/orchorbital_allocator.py'
      - 'gremlin_mcp/orchorbital_executor.py'
      - 'gremlin_mcp/orchorbital_context.py'
      - 'gremlin_mcp/workers.py'
      - 'gremlin_mcp/persistent_workers.py'
      - 'gremlin_mcp/server.py'
      - 'gremlin_mcp/tool_catalog.py'
      - 'gremlin_mcp/core.py'
      - 'gremlin_mcp/worker_client.py'
      - 'gremlin_mcp/product_server.py'
      - 'tests/test_gremlin_orchorbital_fabric_v02.py'
      - 'tests/test_gremlin_orchorbital_executor_v02.py'
      - 'tests/test_gremlin_orchorbital_context_v01.py'
      - 'tests/test_gremlin_orchorbital_context_transport_v01.py'
      - 'tests/test_gremlin_mcp_worker_client_v02.py'
      - 'tests/test_gremlin_mcp_worker_abi_v02.py'
      - 'spec/GREMLIN_ORCHORBITAL_FABRIC_V0_2.md'
      - '.github/workflows/gremlin-orchorbital-v02.yml'
  workflow_dispatch:

jobs:
  orchorbital-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Compile orchorbital modules
        run: >-
          python -m py_compile
          gremlin_mcp/role_registry.py
          gremlin_mcp/orchorbital_fabric.py
          gremlin_mcp/orchorbital_allocator.py
          gremlin_mcp/orchorbital_executor.py
          gremlin_mcp/orchorbital_context.py
          gremlin_mcp/workers.py
          gremlin_mcp/persistent_workers.py
          gremlin_mcp/worker_client.py
          gremlin_mcp/server.py
          gremlin_mcp/product_server.py
          gremlin_mcp/core.py
          gremlin_mcp/tool_catalog.py
      - name: Run orchorbital contract suite
        run: >-
          python -m pytest -q
          tests/test_gremlin_orchorbital_fabric_v02.py
          tests/test_gremlin_orchorbital_executor_v02.py
          tests/test_gremlin_orchorbital_context_v01.py
          tests/test_gremlin_orchorbital_context_transport_v01.py
          tests/test_gremlin_mcp_worker_client_v02.py
          tests/test_gremlin_mcp_worker_abi_v02.py

name: GREMLIN Orchorbital Runtime v0.2

on:
  push:
    branches:
      - 'feat/orchorbital-*'
  pull_request:
    paths:
      - 'gremlin_mcp/role_registry.py'
      - 'gremlin_mcp/orchorbital_fabric.py'
      - 'gremlin_mcp/orchorbital_allocator.py'
      - 'gremlin_mcp/orchorbital_executor.py'
      - 'gremlin_mcp/orchorbital_local.py'
      - 'gremlin_mcp/orchorbital_context.py'
      - 'gremlin_mcp/orchorbital_persistence.py'
      - 'gremlin_mcp/workers.py'
      - 'gremlin_mcp/persistent_workers.py'
      - 'gremlin_mcp/server.py'
      - 'gremlin_mcp/tool_catalog.py'
      - 'tools/gremlin_orchorbital_context_transport_bench_v01.py'
      - 'tools/gremlin_orchorbital_routing_index_bench_v01.py'
      - 'tools/gremlin_geometry_phase_scheduler_v01.py'
      - 'gremlin_mcp/core.py'
      - 'gremlin_mcp/worker_client.py'
      - 'gremlin_mcp/product_server.py'
      - 'tests/test_gremlin_orchorbital_fabric_v02.py'
      - 'tests/test_gremlin_orchorbital_executor_v02.py'
      - 'tests/test_gremlin_orchorbital_context_v01.py'
      - 'tests/test_gremlin_orchorbital_persistence_v01.py'
      - 'tests/test_gremlin_orchorbital_worker_transport_v02.py'
      - 'tests/test_gremlin_orchorbital_context_transport_v01.py'
      - 'tests/test_gremlin_orchorbital_context_transport_bench_v01.py'
      - 'tests/test_gremlin_orchorbital_routing_index_bench_v01.py'
      - 'tests/test_gremlin_orchorbital_checkpoint_v01.py'
      - 'tests/test_gremlin_orchorbital_local_adapters_v01.py'
      - 'tests/test_gremlin_mcp_worker_client_v02.py'
      - 'tests/test_gremlin_mcp_worker_abi_v02.py'
      - 'tests/test_gremlin_mcp_persistence_v03.py'
      - 'tests/test_gremlin_geometry_phase_scheduler_v01.py'
      - 'spec/GREMLIN_ORCHORBITAL_FABRIC_V0_2.md'
      - '.github/workflows/gremlin-orchorbital-v02.yml'
  workflow_dispatch:

jobs:
  orchorbital-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Compile orchorbital modules
        run: >-
          python -m py_compile
          gremlin_mcp/role_registry.py
          gremlin_mcp/orchorbital_fabric.py
          gremlin_mcp/orchorbital_allocator.py
          gremlin_mcp/orchorbital_executor.py
          gremlin_mcp/orchorbital_local.py
          gremlin_mcp/orchorbital_context.py
          gremlin_mcp/orchorbital_persistence.py
          gremlin_mcp/workers.py
          gremlin_mcp/persistent_workers.py
          gremlin_mcp/worker_client.py
          gremlin_mcp/server.py
          gremlin_mcp/product_server.py
          gremlin_mcp/core.py
          gremlin_mcp/tool_catalog.py
          tools/gremlin_orchorbital_context_transport_bench_v01.py
          tools/gremlin_orchorbital_routing_index_bench_v01.py
          tools/gremlin_geometry_phase_scheduler_v01.py
      - name: Run orchorbital contract suite
        run: >-
          python -m pytest -q
          tests/test_gremlin_orchorbital_fabric_v02.py
          tests/test_gremlin_orchorbital_executor_v02.py
          tests/test_gremlin_orchorbital_context_v01.py
          tests/test_gremlin_orchorbital_persistence_v01.py
          tests/test_gremlin_orchorbital_worker_transport_v02.py
          tests/test_gremlin_orchorbital_context_transport_v01.py
          tests/test_gremlin_orchorbital_context_transport_bench_v01.py
          tests/test_gremlin_orchorbital_routing_index_bench_v01.py
          tests/test_gremlin_orchorbital_checkpoint_v01.py
          tests/test_gremlin_orchorbital_local_adapters_v01.py
          tests/test_gremlin_mcp_worker_client_v02.py
          tests/test_gremlin_mcp_worker_abi_v02.py
          tests/test_gremlin_mcp_persistence_v03.py
          tests/test_gremlin_geometry_phase_scheduler_v01.py

      - name: Run bounded context transport benchmark
        run: >-
          python -c "from tools.gremlin_orchorbital_context_transport_bench_v01 import run_benchmark;
          r=run_benchmark(branches=3, depth=4, shared_chars=4096, delta_chars=64, cache_limit=64);
          assert r['verdict'].startswith('PASS_'), r"

      - name: Run structural routing index benchmark
        run: >-
          python -c "from tools.gremlin_orchorbital_routing_index_bench_v01 import run_benchmark;
          r=run_benchmark(target_tasks=4, unrelated_tasks=1024);
          assert r['verdict'].startswith('PASS_'), r;
          assert r['summary']['structural_scan_reduction_ratio'] > 200.0, r;
          assert r['summary']['end_to_end_speedup_claim'] is False, r"

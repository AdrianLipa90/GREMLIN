name: GREMLIN Web Live

on:
  push:
    branches:
      - feat/gremlin-research-engine-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run web research unit tests
        run: python -m pytest -q tests/test_web_research.py

  web-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run live GREMLIN internet research probe
        run: >-
          python tools/gremlin_web_live_probe_v01.py
          --query "information geometry quantum gravity Shannon entropy"
          --limit 5
      - name: Upload live research receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-web-live-receipt
          path: artifacts/gremlin_web_live_receipt.json
          if-no-files-found: warn

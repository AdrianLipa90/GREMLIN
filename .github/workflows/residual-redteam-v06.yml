name: residual-redteam-v06

on:
  push:
    branches:
      - audit/residual-redteam-v06-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Pin v0.3/v0.4 failures
        run: |
          python -m pytest -q tests/redteam/test_residual_v03_prefx_failures.py
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v04.py
          python -m pytest -q tests/redteam/test_recursive_residual_v04.py
      - name: v0.5 sequential and phase controls
        run: |
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v05.py
          python -m pytest -q tests/redteam/test_recursive_residual_v05.py
      - name: v0.6 low-frequency ambiguity controls
        run: python -m pytest -q tests/redteam/test_residual_spectroscopy_v06.py

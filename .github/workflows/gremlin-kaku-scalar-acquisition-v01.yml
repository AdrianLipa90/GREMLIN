name: GREMLIN KAKU Scalar Acquisition v0.1

on:
  push:
    branches:
      - feat/gremlin-kaku-scalar-acquisition-v0.1
  pull_request:
    paths:
      - 'tools/gremlin_kaku_scalar_acquisition_v01.py'
      - 'tools/gremlin_kaku_radical_scalar_plane_v01.py'
      - 'tools/gremlin_scalar_admitted_phasenav_v02.py'
      - 'tests/test_gremlin_kaku_scalar_acquisition_v01.py'
      - 'tests/test_gremlin_kaku_radical_scalar_plane_v01.py'
      - 'tests/test_gremlin_scalar_admitted_phasenav_v02.py'
      - 'spec/GREMLIN_KAKU_SCALAR_ACQUISITION_V0_1.md'
      - '.github/workflows/gremlin-kaku-scalar-acquisition-v01.yml'

jobs:
  kaku-scalar-acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Run acquisition and downstream pre-vector contract tests
        run: python -m pytest -q tests/test_gremlin_kaku_scalar_acquisition_v01.py tests/test_gremlin_kaku_radical_scalar_plane_v01.py tests/test_gremlin_scalar_admitted_phasenav_v02.py

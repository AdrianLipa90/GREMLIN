name: GREMLIN semantic orbital mass-role firewall v0.6

on:
  push:
    branches:
      - feat/semantic-orbital-mass-role-firewall-v0.6
  pull_request:
    branches:
      - feat/semantic-orbital-radial-angular-factorization-v0.5

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run mass-role firewall tests
        run: python -m pytest -q tests/test_gremlin_semantic_orbital_mass_role_firewall_v06.py

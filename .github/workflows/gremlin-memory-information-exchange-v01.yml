name: GREMLIN memory information exchange v0.1

on:
  pull_request:
    branches:
      - main
      - formalism/spectroscopic-holonomy-bridge-20260919
    paths:
      - 'gremlin_mcp/memory_exchange.py'
      - 'gremlin_mcp/server_with_hive.py'
      - 'gremlin_mcp/hive_authority_server.py'
      - 'gremlin_mcp/hive_server.py'
      - 'gremlin_mcp/hive_authority.py'
      - 'gremlin_mcp/orbital_hive_memory.py'
      - 'tests/test_gremlin_memory_exchange_v01.py'
      - 'spec/GREMLIN_MEMORY_INFORMATION_EXCHANGE_V0_1.md'
      - '.github/workflows/gremlin-memory-information-exchange-v01.yml'

permissions:
  contents: read

jobs:
  memory-information-exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install GREMLIN MCP and pytest
        run: python -m pip install -e . pytest
      - name: Compile memory exchange and Hive surfaces
        run: >-
          python -m py_compile
          gremlin_mcp/memory_exchange.py
          gremlin_mcp/server_with_hive.py
          gremlin_mcp/hive_authority_server.py
          gremlin_mcp/hive_server.py
      - name: Run focused memory exchange tests
        run: python -m pytest -q tests/test_gremlin_memory_exchange_v01.py

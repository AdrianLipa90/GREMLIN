name: GREMLIN PhaseNav VCS MCP v0.1

on:
  push:
    branches:
      - candidate/phasenav-mcp-vcs-gremlin-v0.1-20260915
  pull_request:
    paths:
      - 'gremlin_mcp/phasenav_vcs_capability.py'
      - 'gremlin_mcp/phasenav_vcs_server.py'
      - 'native/GREMLIN_PHASENAV_MCP_VCS_CAPABILITY_V0_1.pnv'
      - 'spec/GREMLIN_PHASENAV_MCP_VCS_CAPABILITY_V0_1.md'
      - 'tests/test_gremlin_phasenav_vcs_capability_v01.py'
      - 'tests/test_gremlin_phasenav_vcs_server_v01.py'
      - 'pyproject.toml'
      - '.github/workflows/gremlin-phasenav-vcs-capability-v01.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate and test runner
        run: python -m pip install -e . pytest
      - name: Run PhaseNav VCS MCP contract tests
        run: >-
          python -m pytest -q
          tests/test_gremlin_phasenav_vcs_capability_v01.py
          tests/test_gremlin_phasenav_vcs_server_v01.py
      - name: Enforce no shell/process escape in capability modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [
              Path('gremlin_mcp/phasenav_vcs_capability.py'),
              Path('gremlin_mcp/phasenav_vcs_server.py'),
          ]

          def dotted(node):
              if isinstance(node, ast.Name):
                  return node.id
              if isinstance(node, ast.Attribute):
                  left = dotted(node.value)
                  return f'{left}.{node.attr}' if left else node.attr
              return ''

          violations = []
          for path in paths:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name == 'subprocess':
                              violations.append((str(path), node.lineno, 'import subprocess'))
                  elif isinstance(node, ast.ImportFrom):
                      if node.module == 'subprocess':
                          violations.append((str(path), node.lineno, 'from subprocess import ...'))
                  elif isinstance(node, ast.Call):
                      target = dotted(node.func)
                      if target in {
                          'os.system',
                          'os.popen',
                          'subprocess.run',
                          'subprocess.call',
                          'subprocess.check_call',
                          'subprocess.check_output',
                          'subprocess.Popen',
                      }:
                          violations.append((str(path), node.lineno, target))
                      for keyword in node.keywords:
                          if keyword.arg == 'shell' and isinstance(keyword.value, ast.Constant) and keyword.value.value is True:
                              violations.append((str(path), node.lineno, 'shell=True'))
          assert not violations, f'forbidden escape surfaces: {violations}'
          PY

name: GREMLIN PhaseNav VCS MCP v0.1

on:
  push:
    branches:
      - candidate/phasenav-mcp-vcs-gremlin-v0.1-20260915
  pull_request:
    paths:
      - 'gremlin_mcp/phasenav_vcs_capability.py'
      - 'gremlin_mcp/phasenav_vcs_server.py'
      - 'native/GREMLIN_PHASENAV_MCP_VCS_CAPABILITY_V0_1.pnv'
      - 'spec/GREMLIN_PHASENAV_MCP_VCS_CAPABILITY_V0_1.md'
      - 'tests/test_gremlin_phasenav_vcs_capability_v01.py'
      - 'pyproject.toml'
      - '.github/workflows/gremlin-phasenav-vcs-capability-v01.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate and test runner
        run: python -m pip install -e . pytest
      - name: Run PhaseNav VCS MCP contract tests
        run: python -m pytest -q tests/test_gremlin_phasenav_vcs_capability_v01.py
      - name: Enforce no shell/process escape in capability modules
        run: >-
          python -c "from pathlib import Path;
          paths=[Path('gremlin_mcp/phasenav_vcs_capability.py'),Path('gremlin_mcp/phasenav_vcs_server.py')];
          text='\n'.join(p.read_text(encoding='utf-8') for p in paths);
          forbidden=['subprocess','os.system','shell=True','Popen(','git '];
          hits=[x for x in forbidden if x in text];
          assert not hits, f'forbidden escape surfaces: {hits}'"

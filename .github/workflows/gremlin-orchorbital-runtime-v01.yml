name: GREMLIN Orchorbital Runtime v0.2

on:
  pull_request:
    paths:
      - 'gremlin_mcp/role_registry.py'
      - 'gremlin_mcp/orchorbital_runtime.py'
      - 'gremlin_mcp/orchorbital_bridge.py'
      - 'gremlin_mcp/orchorbital_fabric.py'
      - 'gremlin_mcp/orchorbital_allocator.py'
      - 'gremlin_mcp/orchorbital_executor.py'
      - 'tests/test_gremlin_orchorbital_runtime_v01.py'
      - 'tests/test_gremlin_orchorbital_bridge_v01.py'
      - 'tests/test_gremlin_orchorbital_fabric_v02.py'
      - 'tests/test_gremlin_orchorbital_executor_v02.py'
      - 'spec/GREMLIN_ORCHORBITAL_RUNTIME_V0_1.md'
      - 'spec/GREMLIN_ORCHORBITAL_FABRIC_V0_2.md'
      - '.github/workflows/gremlin-orchorbital-runtime-v01.yml'
  workflow_dispatch:

jobs:
  orchorbital-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Compile orchorbital modules
        run: >-
          python -m py_compile
          gremlin_mcp/role_registry.py
          gremlin_mcp/orchorbital_runtime.py
          gremlin_mcp/orchorbital_bridge.py
          gremlin_mcp/orchorbital_fabric.py
          gremlin_mcp/orchorbital_allocator.py
          gremlin_mcp/orchorbital_executor.py
      - name: Run orchorbital contract suite
        run: >-
          python -m pytest -q
          tests/test_gremlin_orchorbital_runtime_v01.py
          tests/test_gremlin_orchorbital_bridge_v01.py
          tests/test_gremlin_orchorbital_fabric_v02.py
          tests/test_gremlin_orchorbital_executor_v02.py

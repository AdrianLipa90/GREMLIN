name: GREMLIN Bestiary PhaseNav Phase Gates v0.1

on:
  push:
    branches:
      - main
      - 'feat/bestiary-phasenav-phase-gates-v0.1'
    paths:
      - 'tools/gremlin_bestiary_phasenav_phase_gates_v01.py'
      - 'tools/gremlin_bestiary_phasenav_numpy_v01.py'
      - 'tools/gremlin_bestiary_phasenav_numpy_bench_v01.py'
      - 'tools/gremlin_bestiary_phasenav_live_binding_v01.py'
      - 'tools/gremlin_bestiary_phasenav_threeway_v01.py'
      - 'tools/gremlin_bestiary_phasenav_threeway_bench_v01.py'
      - 'tools/gremlin_bestiary_phasenav_analog_invariants_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_phase_gates_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_numpy_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_live_binding_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_threeway_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_analog_invariants_v01.py'
      - 'spec/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.md'
      - 'native/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.pnv'
      - '.github/workflows/gremlin-bestiary-phasenav-phase-gates-v01.yml'
  pull_request:
    paths:
      - 'tools/gremlin_bestiary_phasenav_phase_gates_v01.py'
      - 'tools/gremlin_bestiary_phasenav_numpy_v01.py'
      - 'tools/gremlin_bestiary_phasenav_numpy_bench_v01.py'
      - 'tools/gremlin_bestiary_phasenav_live_binding_v01.py'
      - 'tools/gremlin_bestiary_phasenav_threeway_v01.py'
      - 'tools/gremlin_bestiary_phasenav_threeway_bench_v01.py'
      - 'tools/gremlin_bestiary_phasenav_analog_invariants_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_phase_gates_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_numpy_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_live_binding_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_threeway_v01.py'
      - 'tests/test_gremlin_bestiary_phasenav_analog_invariants_v01.py'
      - 'spec/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.md'
      - 'native/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.pnv'
      - '.github/workflows/gremlin-bestiary-phasenav-phase-gates-v01.yml'
  workflow_dispatch:

jobs:
  phase-gate-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test/vector runners
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Compile reference and vector kernels
        run: |
          python -m py_compile tools/gremlin_bestiary_phasenav_phase_gates_v01.py
          python -m py_compile tools/gremlin_bestiary_phasenav_numpy_v01.py
          python -m py_compile tools/gremlin_bestiary_phasenav_numpy_bench_v01.py
          python -m py_compile tools/gremlin_bestiary_phasenav_live_binding_v01.py
          python -m py_compile tools/gremlin_bestiary_phasenav_threeway_v01.py
          python -m py_compile tools/gremlin_bestiary_phasenav_threeway_bench_v01.py
          python -m py_compile tools/gremlin_bestiary_phasenav_analog_invariants_v01.py
      - name: Run 36D phase-gate Bestiary conformance
        run: |
          python -m pytest -q \
            tests/test_gremlin_bestiary_phasenav_phase_gates_v01.py \
            tests/test_gremlin_bestiary_phasenav_numpy_v01.py \
            tests/test_gremlin_bestiary_phasenav_live_binding_v01.py \
            tests/test_gremlin_bestiary_phasenav_threeway_v01.py \
            tests/test_gremlin_bestiary_phasenav_analog_invariants_v01.py
      - name: Run frozen NumPy batch benchmark
        run: python -m tools.gremlin_bestiary_phasenav_numpy_bench_v01
      - name: Verify benchmark equivalence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("provenance/GREMLIN_BESTIARY_PHASENAV_NUMPY_BENCHMARK_V0_1.json")
          d = json.loads(p.read_text())
          s = d["summary"]
          assert s["all_species_scalar_vector_equivalent_1e_12"] is True
          assert s["all_phase_kernels_continuity_candidates"] is True
          assert s["physical_analog_claim"] is False
          assert s["external_effects"] is False
          print(s)
          PY
      - name: Run scalar-vector-continuous three-way benchmark
        run: python -m tools.gremlin_bestiary_phasenav_threeway_bench_v01
      - name: Verify three-way realization gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("provenance/GREMLIN_BESTIARY_PHASENAV_THREEWAY_BENCHMARK_V0_1.json")
          d = json.loads(p.read_text())
          s = d["summary"]
          assert s["all_species_pass"] is True
          assert s["failures"] == []
          assert s["analog_core_numerical_pass_count"] > 0
          assert s["hybrid_pass_count"] > 0
          assert s["fully_analog_physical_pass_count"] == 0
          assert s["physical_analog_claim"] is False
          assert s["hardware_analog_witness"] is False
          print(s)
          PY
      - name: Verify analog-core specialist invariant gate
        run: |
          python - <<'PY'
          from tools.gremlin_bestiary_phasenav_analog_invariants_v01 import run_analog_invariant_suite
          d = run_analog_invariant_suite()
          s = d["summary"]
          assert s["all_analog_core_specialist_invariants_pass"] is True
          assert s["passed"] == 9
          assert s["failed"] == 0
          assert s["fully_analog_specialist_semantics_claim"] is False
          assert s["physical_analog_claim"] is False
          print(s)
          PY
      - name: Verify native contract has no external authority
        run: |
          grep -q '^PNV 1$' native/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.pnv
          grep -q '# NEW_PNV_OPCODES 0' native/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.pnv
          grep -q '# CANON_ALLOWED FALSE' native/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.pnv
          grep -q '# EXTERNAL_EFFECTS FALSE' native/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.pnv
          grep -q '# PHYSICAL_ANALOG_CLAIM FALSE' native/GREMLIN_BESTIARY_PHASENAV_PHASE_GATES_V0_1.pnv
      - name: Upload benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-bestiary-phasenav-numpy-v01
          path: |
            provenance/GREMLIN_BESTIARY_PHASENAV_NUMPY_BENCHMARK_V0_1.json
            provenance/GREMLIN_BESTIARY_PHASENAV_THREEWAY_BENCHMARK_V0_1.json
          if-no-files-found: error

name: residual-redteam-v07

on:
  push:
    branches:
      - audit/residual-redteam-v07-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Prior residual red-team layers
        run: |
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v04.py
          python -m pytest -q tests/redteam/test_recursive_residual_v04.py
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v05.py
          python -m pytest -q tests/redteam/test_recursive_residual_v05.py
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v06.py
      - name: v0.7 weak replicate accumulation
        run: python -m pytest -q tests/redteam/test_residual_spectroscopy_v07.py

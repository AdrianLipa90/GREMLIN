name: GREMLIN Neutrino Information Audit

on:
  push:
    branches:
      - feat/gremlin-three-flavor-neutrino-adapter-v1.5
      - feat/gremlin-belzebub-flavor-information-audit-v1.6
      - feat/gremlin-intention-flavor-bridge-v1.7
      - feat/gremlin-intention-mass-flavor-factorization-v1.8
      - feat/gremlin-J-identifiability-no-go-v1.9
      - feat/gremlin-J-invariant-reduction-audit-v2.0
  pull_request:
    paths:
      - 'tools/gremlin_three_flavor_neutrino_adapter_v15.py'
      - 'tools/gremlin_belzebub_flavor_information_audit_v16.py'
      - 'tools/gremlin_intention_flavor_bridge_v17.py'
      - 'tools/gremlin_intention_mass_flavor_factorization_v18.py'
      - 'tools/gremlin_J_identifiability_no_go_v19.py'
      - 'tools/gremlin_J_invariant_reduction_audit_v20.py'
      - 'tests/test_gremlin_three_flavor_neutrino_adapter_v15.py'
      - 'tests/test_gremlin_belzebub_flavor_information_audit_v16.py'
      - 'tests/test_gremlin_intention_flavor_bridge_v17.py'
      - 'tests/test_gremlin_intention_mass_flavor_factorization_v18.py'
      - 'tests/test_gremlin_J_identifiability_no_go_v19.py'
      - 'tests/test_gremlin_J_invariant_reduction_audit_v20.py'
      - 'spec/GREMLIN_BELZEBUB_FLAVOR_INFORMATION_AUDIT_V1_6.md'
      - 'spec/GREMLIN_INTENTION_FLAVOR_BRIDGE_V1_7.md'
      - 'spec/GREMLIN_INTENTION_MASS_FLAVOR_FACTORIZATION_V1_8.md'
      - 'spec/GREMLIN_J_IDENTIFIABILITY_NO_GO_V1_9.md'
      - 'spec/GREMLIN_J_INVARIANT_REDUCTION_AUDIT_V2_0.md'
      - '.github/workflows/gremlin-neutrino-information.yml'

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile neutrino information modules
        run: python -m py_compile tools/gremlin_three_flavor_neutrino_adapter_v15.py tools/gremlin_belzebub_flavor_information_audit_v16.py tools/gremlin_intention_flavor_bridge_v17.py tools/gremlin_intention_mass_flavor_factorization_v18.py tools/gremlin_J_identifiability_no_go_v19.py tools/gremlin_J_invariant_reduction_audit_v20.py
      - name: Run full GREMLIN regression suite
        run: python -m pytest -q

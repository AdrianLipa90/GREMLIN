name: GREMLIN Full System Benchmark v0.1

on:
  pull_request:
    paths:
      - 'benchmarks/gremlin_full_system_v01.py'
      - 'benchmarks/gremlin_memory_governance_v01.py'
      - 'tools/gremlin_runtime_coverage_audit_v01.py'
      - 'tests/test_gremlin_full_system_benchmark_v01.py'
      - 'spec/GREMLIN_FULL_SYSTEM_BENCHMARK_V0_1.md'
      - 'gremlin_mcp/mathematical_constitution.py'
      - 'gremlin_mcp/memory_capabilities.py'
      - 'gremlin_mcp/hive_server.py'
      - 'gremlin_mcp/hive_authority_server.py'
      - 'gremlin_mcp/server_with_hive.py'
      - 'gremlin_mcp/bestiary_memory_gateway.py'
      - 'gremlin_mcp/raphael.py'
      - 'benchmarks/gremlin_research_orchestrator_v02.py'
      - 'benchmarks/gremlin_ood_routing_v06.py'
      - 'tools/gremlin_bestiary_bench_v01.py'
      - 'tools/gremlin_geometry_phase_scheduler_bench_v01.py'
      - 'tools/gremlin_bestiary_phasenav_numpy_bench_v01.py'
      - '.github/workflows/gremlin-full-system-benchmark-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-system-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GREMLIN benchmark surface
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest numpy

      - name: Compile benchmark and constitutional surfaces
        run: >-
          python -m py_compile
          benchmarks/gremlin_full_system_v01.py
          benchmarks/gremlin_memory_governance_v01.py
          tools/gremlin_runtime_coverage_audit_v01.py
          gremlin_mcp/mathematical_constitution.py
          gremlin_mcp/memory_capabilities.py

      - name: Run benchmark-harness invariant tests
        run: >-
          python -m pytest -q
          tests/test_gremlin_full_system_benchmark_v01.py
          tests/test_gremlin_mathematical_constitution_v01.py
          tests/test_bestiary_memory_capabilities_v01.py

      - name: Execute full benchmark suite
        run: >-
          python -m benchmarks.gremlin_full_system_v01
          --out provenance/GREMLIN_FULL_SYSTEM_BENCHMARK_V0_1.json
          --orchestrator-repetitions 5000
          --microbench-repetitions 5000
          --bestiary-items 10000
          --phasenav-batch 512

      - name: Validate benchmark receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("provenance/GREMLIN_FULL_SYSTEM_BENCHMARK_V0_1.json")
          row = json.loads(path.read_text())
          assert row["schema"] == "GREMLIN_FULL_SYSTEM_BENCHMARK_AND_ABLATION_V0_1"
          assert row["summary"]["benchmark_execution_success"] is True
          assert row["constitution_ablation"]["pass"] is True
          assert row["fault_injection"]["pass"] is True
          assert row["memory_and_governance"]["summary"]["all_exact_invariants_pass"] is True
          assert len(row["benchmark_sha256"]) == 64
          print(json.dumps(row["summary"], sort_keys=True))
          print(json.dumps(row["runtime_coverage"]["summary"], sort_keys=True))
          print(json.dumps(row["legacy_semantic_summary"], sort_keys=True))
          PY

      - name: Upload exact-head benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-full-system-benchmark-v0.1
          path: provenance/GREMLIN_FULL_SYSTEM_BENCHMARK_V0_1.json
          retention-days: 30

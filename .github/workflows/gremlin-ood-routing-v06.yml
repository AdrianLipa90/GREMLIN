name: GREMLIN OOD Routing v0.6

on:
  push:
    branches:
      - feat/gremlin-ood-routing-v0.6
      - main
    paths:
      - 'gremlin_mcp/router.py'
      - 'gremlin_mcp/research_planner_v02.py'
      - 'tests/test_gremlin_mcp_octopus_router_v05.py'
      - 'tests/test_research_planner_v02.py'
      - 'tests/test_research_planner_ood_v06.py'
      - 'benchmarks/gremlin_research_orchestrator_v02.py'
      - 'benchmarks/gremlin_ood_routing_v06.py'
      - 'spec/GREMLIN_OOD_ROUTING_V0_6.md'
      - '.github/workflows/gremlin-ood-routing-v06.yml'
  pull_request:
    paths:
      - 'gremlin_mcp/router.py'
      - 'gremlin_mcp/research_planner_v02.py'
      - 'tests/test_gremlin_mcp_octopus_router_v05.py'
      - 'tests/test_research_planner_v02.py'
      - 'tests/test_research_planner_ood_v06.py'
      - 'benchmarks/gremlin_research_orchestrator_v02.py'
      - 'benchmarks/gremlin_ood_routing_v06.py'
      - 'spec/GREMLIN_OOD_ROUTING_V0_6.md'
      - '.github/workflows/gremlin-ood-routing-v06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ood-routing-v06:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GREMLIN and pytest
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run router and planner regression tests
        run: >-
          python -m pytest -q
          tests/test_gremlin_mcp_octopus_router_v05.py
          tests/test_research_planner_v02.py
          tests/test_research_planner_ood_v06.py
      - name: Re-run frozen 12-case control-plane benchmark
        run: >-
          python -m benchmarks.gremlin_research_orchestrator_v02
          --repetitions 2000
          --out artifacts/gremlin_research_orchestrator_benchmark_v02.json
      - name: Run OOD routing benchmark v0.6
        run: >-
          python -m benchmarks.gremlin_ood_routing_v06
          > artifacts/gremlin_ood_routing_v06.json
      - name: Enforce OOD and frozen-suite gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          frozen = json.loads(Path('artifacts/gremlin_research_orchestrator_benchmark_v02.json').read_text(encoding='utf-8'))
          ood = json.loads(Path('artifacts/gremlin_ood_routing_v06.json').read_text(encoding='utf-8'))

          fg = frozen['gremlin']
          fc = frozen['comparison']
          gates = {
              'frozen_precision_eq_1': fg['precision'] == 1.0,
              'frozen_recall_eq_1': fg['recall'] == 1.0,
              'frozen_stage_exact_eq_1': fg['stage_exact_rate'] == 1.0,
              'frozen_fanout_reduction_ge_0_35': fc['fanout_reduction_fraction'] >= 0.35,
              'ood_all_gates_pass': ood['all_gates_pass'] is True,
          }
          print(json.dumps({'gates': gates, 'ood': ood['semantic'], 'fanout': ood['fanout'], 'ambiguity_false_additions': ood['ambiguity_false_additions']}, indent=2, sort_keys=True))
          if not all(gates.values()):
              raise SystemExit(1)
          PY
      - name: Upload routing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-ood-routing-v06-${{ github.sha }}
          path: |
            artifacts/gremlin_research_orchestrator_benchmark_v02.json
            artifacts/gremlin_ood_routing_v06.json
          if-no-files-found: error

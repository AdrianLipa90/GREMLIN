name: GREMLIN full-text paper audit v0.1

on:
  push:
    branches:
      - bench/external-paper-audit-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-text-audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest sympy
      - name: Run paper audit tests
        run: python -m pytest -q tests/test_full_text_audit.py tests/test_paper_audit_eval.py tests/test_equation_audit.py tests/test_equation_bundle.py

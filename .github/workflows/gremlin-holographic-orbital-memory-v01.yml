name: GREMLIN holographic orbital memory v0.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'gremlin_mcp/holographic_orbital_memory.py'
      - 'tests/test_holographic_orbital_memory_v01.py'
      - 'tests/test_holographic_orbital_memory_hive_surface_v01.py'
      - 'gremlin_mcp/server_with_hive.py'
      - 'benchmarks/gremlin_holographic_orbital_memory_v01.py'
      - 'benchmarks/results/GREMLIN_HOLOGRAPHIC_ORBITAL_MEMORY_VALIDATION_V0_1.json'
      - 'benchmarks/results/GREMLIN_HOLOGRAPHIC_ORBITAL_MEMORY_LIVE_REMAP_20260923.json'
      - 'spec/GREMLIN_HOLOGRAPHIC_ORBITAL_MEMORY_V0_1.md'
      - '.github/workflows/gremlin-holographic-orbital-memory-v01.yml'
  workflow_dispatch:

jobs:
  holographic-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_holographic_orbital_memory_v01.py tests/test_holographic_orbital_memory_hive_surface_v01.py
      - run: PYTHONPATH=. python benchmarks/gremlin_holographic_orbital_memory_v01.py

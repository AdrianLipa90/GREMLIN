name: GREMLIN semantic orbital radial-angular v0.5

on:
  push:
    branches:
      - feat/semantic-orbital-radial-angular-factorization-v0.5
  pull_request:
    branches:
      - feat/semantic-orbital-rfc-source-density-v0.4

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run radial-angular factorization tests
        run: python -m pytest -q tests/test_gremlin_semantic_orbital_radial_angular_factorization_v05.py

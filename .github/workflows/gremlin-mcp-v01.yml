name: GREMLIN MCP v0.2

on:
  push:
    branches:
      - feat/gremlin-mcp-v0.1
  pull_request:
    paths:
      - 'gremlin_mcp/**'
      - 'tools/__init__.py'
      - 'tools/gremlin_bestiary_orbital_scheduler_v02.py'
      - 'tools/gremlin_bestiary_vector_species_v03.py'
      - 'tools/gremlin_client_protocol_v01.py'
      - 'tests/test_gremlin_mcp_v01.py'
      - 'tests/test_gremlin_mcp_worker_abi_v02.py'
      - 'spec/GREMLIN_MCP_SERVER_V0_1.md'
      - 'spec/GREMLIN_MCP_WORKER_ABI_V0_2.md'
      - 'pyproject.toml'
      - 'README.md'
      - '.github/workflows/gremlin-mcp-v01.yml'

jobs:
  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GREMLIN MCP and test runner
        run: python -m pip install -e . pytest
      - name: Run standalone MCP and Worker ABI contract tests
        run: python -m pytest -q tests/test_gremlin_mcp_v01.py tests/test_gremlin_mcp_worker_abi_v02.py

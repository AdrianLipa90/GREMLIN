name: GREMLIN Visual Client v0.1

on:
  push:
    branches:
      - feat/gremlin-visual-client-v0.1
      - feat/gremlin-scalar-acquisition-v0.2
      - feat/gremlin-scalar-source-registry-v0.3
      - feat/gremlin-kaku-scalar-facets-v0.4
      - feat/gremlin-affect-field-v0.5
      - feat/gremlin-epistemic-bundle-v0.6
      - feat/gremlin-valuation-integrity-bundles-v0.7
      - feat/gremlin-relational-lambda-holonomy-v0.8
      - feat/gremlin-relational-hamiltonian-entanglement-v0.9
  pull_request:
    paths:
      - 'client/gremlin_web_server_v01.py'
      - 'client/web/index.html'
      - 'client/web/styles.css'
      - 'client/web/app.js'
      - 'tools/gremlin_kaku_radical_scalar_plane_v01.py'
      - 'tools/gremlin_scalar_admitted_phasenav_v02.py'
      - 'tools/gremlin_scalar_acquisition_v02.py'
      - 'tools/gremlin_scalar_source_registry_v03.py'
      - 'tools/gremlin_scalar_source_firewall_v03.py'
      - 'tools/gremlin_kaku_scalar_facets_v04.py'
      - 'tools/gremlin_kaku_scalar_facet_firewall_v04.py'
      - 'tools/gremlin_affect_field_v05.py'
      - 'tools/gremlin_scalar_source_delta_v05.py'
      - 'tools/gremlin_epistemic_bundle_v06.py'
      - 'tools/gremlin_valuation_integrity_bundles_v07.py'
      - 'tools/gremlin_relational_lambda_holonomy_v08.py'
      - 'tools/gremlin_relational_hamiltonian_entanglement_v09.py'
      - 'tools/gremlin_relational_entanglement_firewall_v09.py'
      - 'tests/test_gremlin_kaku_radical_scalar_plane_v01.py'
      - 'tests/test_gremlin_scalar_admitted_phasenav_v02.py'
      - 'tests/test_gremlin_scalar_acquisition_v02.py'
      - 'tests/test_gremlin_scalar_source_registry_v03.py'
      - 'tests/test_gremlin_kaku_scalar_facets_v04.py'
      - 'tests/test_gremlin_intention_anchor_provenance_v04.py'
      - 'tests/test_gremlin_affect_field_v05.py'
      - 'tests/test_gremlin_epistemic_bundle_v06.py'
      - 'tests/test_gremlin_valuation_integrity_bundles_v07.py'
      - 'tests/test_gremlin_relational_lambda_holonomy_v08.py'
      - 'tests/test_gremlin_relational_hamiltonian_entanglement_v09.py'
      - 'tests/test_gremlin_visual_client_v01.py'
      - 'tests/test_gremlin_phasenav_prototype_pipeline_v01.py'
      - 'tests/test_native_pnv_contracts.py'
      - 'provenance/SCALAR_ACQUISITION_LIVE_NOEMA_WITNESS_V0_2.json'
      - 'provenance/NOEMA_ETHICS_CAPABILITY_LIVE_WITNESS_V0_3.json'
      - 'provenance/INTENTION_PHASE_ANCHOR_LIVE_WITNESS_V0_4.json'
      - 'provenance/RELATIONAL_LAMBDA_SOURCE_WITNESS_V0_8.json'
      - 'spec/GREMLIN_KAKU_RADICAL_SCALAR_PLANE_V0_1.md'
      - 'spec/GREMLIN_SCALAR_ACQUISITION_V0_2.md'
      - 'spec/GREMLIN_SCALAR_SOURCE_REGISTRY_V0_3.md'
      - 'spec/GREMLIN_KAKU_SCALAR_FACETS_V0_4.md'
      - 'spec/GREMLIN_RIFC_AFFECT_FIELD_V0_5.md'
      - 'spec/GREMLIN_EPISTEMIC_SUPPORT_BUNDLE_V0_6.md'
      - 'spec/GREMLIN_VALUATION_INTEGRITY_BUNDLES_V0_7.md'
      - 'spec/GREMLIN_RELATIONAL_LAMBDA_HOLONOMY_V0_8.md'
      - 'spec/GREMLIN_RELATIONAL_HAMILTONIAN_ENTANGLEMENT_V0_9.md'
      - 'spec/GREMLIN_VISUAL_CLIENT_V0_1.md'
      - '.github/workflows/gremlin-visual-client-v01.yml'

jobs:
  visual-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Check browser JavaScript syntax
        run: node --check client/web/app.js
      - name: Run Hamiltonian, Lambda-holonomy, valuation, epistemic, affect, scalar, admission, client and native tests
        run: python -m pytest -q tests/test_gremlin_relational_hamiltonian_entanglement_v09.py tests/test_gremlin_relational_lambda_holonomy_v08.py tests/test_gremlin_valuation_integrity_bundles_v07.py tests/test_gremlin_epistemic_bundle_v06.py tests/test_gremlin_affect_field_v05.py tests/test_gremlin_kaku_scalar_facets_v04.py tests/test_gremlin_intention_anchor_provenance_v04.py tests/test_gremlin_scalar_source_registry_v03.py tests/test_gremlin_scalar_acquisition_v02.py tests/test_gremlin_kaku_radical_scalar_plane_v01.py tests/test_gremlin_scalar_admitted_phasenav_v02.py tests/test_gremlin_visual_client_v01.py tests/test_gremlin_phasenav_prototype_pipeline_v01.py tests/test_native_pnv_contracts.py

name: GREMLIN memory consolidation v0.1

on:
  pull_request:
    branches:
      - main
      - formalism/memory-anti-entropy-sync-v01-20260920
    paths:
      - 'gremlin_mcp/memory_consolidation.py'
      - 'gremlin_mcp/memory_exchange.py'
      - 'gremlin_mcp/server_with_hive.py'
      - 'gremlin_mcp/hive_authority_server.py'
      - 'gremlin_mcp/hive_server.py'
      - 'tests/test_gremlin_memory_consolidation_v01.py'
      - 'spec/GREMLIN_MEMORY_CONSOLIDATION_V0_1.md'
      - '.github/workflows/gremlin-memory-consolidation-v01.yml'

permissions:
  contents: read

jobs:
  memory-consolidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GREMLIN and pytest
        run: python -m pip install -e . pytest
      - name: Compile consolidation surfaces
        run: >-
          python -m py_compile
          gremlin_mcp/memory_consolidation.py
          gremlin_mcp/memory_exchange.py
          gremlin_mcp/server_with_hive.py
          gremlin_mcp/hive_authority_server.py
          gremlin_mcp/hive_server.py
      - name: Run focused consolidation tests
        run: >-
          python -m pytest -q
          tests/test_gremlin_memory_consolidation_v01.py

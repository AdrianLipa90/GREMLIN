name: GREMLIN Orbit Source-Coupling Identifiability v0.8

on:
  push:
    branches:
      - feat/orbit-source-coupling-identifiability-v0.8-normalized
  pull_request:
    paths:
      - 'tools/gremlin_orbit_source_coupling_identifiability_v08.py'
      - 'tests/test_gremlin_orbit_source_coupling_identifiability_v08.py'
      - 'spec/GREMLIN_ORBIT_SOURCE_COUPLING_IDENTIFIABILITY_V0_8.md'
      - 'provenance/GREMLIN_ORBIT_SOURCE_COUPLING_IDENTIFIABILITY_V0_8.json'
      - '.github/workflows/gremlin-orbit-source-coupling-identifiability-v08.yml'

jobs:
  exact-identifiability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run v0.8 deterministic identifiability suite
        run: python -m pytest -q tests/test_gremlin_orbit_source_coupling_identifiability_v08.py

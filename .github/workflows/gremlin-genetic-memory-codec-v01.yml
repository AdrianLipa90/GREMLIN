name: GREMLIN genetic memory codec v0.1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gremlin_mcp/genetic_memory_codec.py'
      - 'gremlin_mcp/hive_authority.py'
      - 'tests/test_gremlin_genetic_memory_codec_v01.py'
      - 'tests/test_gremlin_genetic_memory_hive_integration_v01.py'
      - 'spec/GREMLIN_GENETIC_MEMORY_CODEC_V0_1.md'
      - '.github/workflows/gremlin-genetic-memory-codec-v01.yml'

permissions:
  contents: read

jobs:
  genetic-memory-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install GREMLIN MCP and pytest
        run: python -m pip install -e . pytest
      - name: Compile genetic memory and Hive authority
        run: >-
          python -m py_compile
          gremlin_mcp/genetic_memory_codec.py
          gremlin_mcp/hive_authority.py
      - name: Run focused genetic memory tests
        run: >-
          python -m pytest -q
          tests/test_gremlin_genetic_memory_codec_v01.py
          tests/test_gremlin_genetic_memory_hive_integration_v01.py

name: residual-redteam-v09

on:
  push:
    branches:
      - audit/residual-redteam-v09-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Residual red-team chain
        run: |
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v04.py
          python -m pytest -q tests/redteam/test_recursive_residual_v04.py
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v05.py
          python -m pytest -q tests/redteam/test_recursive_residual_v05.py
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v06.py
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v07.py
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v08.py
          python -m pytest -q tests/redteam/test_residual_spectroscopy_v09.py

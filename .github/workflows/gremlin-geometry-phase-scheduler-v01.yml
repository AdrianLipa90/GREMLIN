name: GREMLIN Geometry Phase Scheduler v0.1

on:
  pull_request:
    paths:
      - 'gremlin_mcp/workers.py'
      - 'gremlin_mcp/worker_client.py'
      - 'gremlin_mcp/pipeline.py'
      - 'gremlin_mcp/router.py'
      - 'gremlin_mcp/core.py'
      - 'gremlin_mcp/server.py'
      - 'tools/gremlin_geometry_phase_scheduler_v01.py'
      - 'tools/gremlin_geometry_context_token_bench_v01.py'
      - 'tools/gremlin_geometry_context_pack_v01.py'
      - 'tools/gremlin_geometry_phase_scheduler_bench_v01.py'
      - 'tests/test_gremlin_geometry_phase_scheduler_*.py'
      - 'tests/test_gremlin_geometry_context_pack_v01.py'
      - 'tests/test_gremlin_geometry_scheduler_pipeline_v01.py'
      - 'tests/test_gremlin_mcp_worker_abi_v02.py'
      - 'spec/GREMLIN_GEOMETRY_PHASE_STATE_SCHEDULER_V0_1.md'
      - 'spec/GREMLIN_MCP_WORKER_ABI_V0_2.md'
      - '.github/workflows/gremlin-geometry-phase-scheduler-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'gremlin_mcp/workers.py'
      - 'gremlin_mcp/worker_client.py'
      - 'gremlin_mcp/pipeline.py'
      - 'gremlin_mcp/router.py'
      - 'gremlin_mcp/core.py'
      - 'gremlin_mcp/server.py'
      - 'tools/gremlin_geometry_phase_scheduler_v01.py'
      - 'tools/gremlin_geometry_phase_scheduler_bench_v01.py'
      - 'tools/gremlin_geometry_context_pack_v01.py'
      - 'tools/gremlin_geometry_context_token_bench_v01.py'
      - 'tests/test_gremlin_geometry_phase_scheduler_*.py'
      - 'tests/test_gremlin_geometry_context_pack_v01.py'
      - 'tests/test_gremlin_geometry_scheduler_pipeline_v01.py'
      - 'tests/test_gremlin_mcp_worker_abi_v02.py'
      - 'spec/GREMLIN_GEOMETRY_PHASE_STATE_SCHEDULER_V0_1.md'
      - 'spec/GREMLIN_MCP_WORKER_ABI_V0_2.md'
      - '.github/workflows/gremlin-geometry-phase-scheduler-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-phase-state-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GREMLIN, test runner and benchmark tokenizer
        run: python -m pip install --disable-pip-version-check -e . pytest tiktoken
      - name: Compile scheduler surfaces
        run: |
          python -m py_compile tools/gremlin_geometry_phase_scheduler_v01.py
          python -m py_compile tools/gremlin_geometry_phase_scheduler_bench_v01.py
          python -m py_compile tools/gremlin_geometry_context_pack_v01.py
          python -m py_compile tools/gremlin_geometry_context_token_bench_v01.py
          python -m py_compile gremlin_mcp/workers.py
          python -m py_compile gremlin_mcp/worker_client.py
          python -m py_compile gremlin_mcp/pipeline.py
          python -m py_compile gremlin_mcp/router.py
      - name: Run scheduler and Worker ABI tests
        run: >-
          python -m pytest -q
          tests/test_gremlin_geometry_phase_scheduler_v01.py
          tests/test_gremlin_geometry_phase_scheduler_bench_v01.py
          tests/test_gremlin_geometry_context_pack_v01.py
          tests/test_gremlin_geometry_scheduler_pipeline_v01.py
          tests/test_gremlin_mcp_worker_abi_v02.py
      - name: Run deterministic synthetic scheduler benchmark
        run: python -m tools.gremlin_geometry_phase_scheduler_bench_v01
      - name: Verify benchmark receipt discipline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("provenance/GREMLIN_GEOMETRY_PHASE_SCHEDULER_BENCHMARK_V0_1.json")
          d=json.loads(p.read_text())
          s=d["summary"]
          assert d["verdict"] == "PASS_SYNTHETIC_GEOMETRY_SCHEDULING"
          assert s["transition_reduction_vs_fifo_proxy"] > 0.20
          assert s["lexical_overlap_gain"] > 0.05
          assert s["topic_purity_gain"] > 0.20
          assert s["actual_model_token_accounting"] is False
          assert s["token_saving_claim"] is False
          assert s["external_effects"] is False
          assert s["canon_allowed"] is False
          print(s)
          PY
      - name: Run tokenizer-specific context pack benchmark
        run: python -m tools.gremlin_geometry_context_token_bench_v01
      - name: Verify tokenizer benchmark claim scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("provenance/GREMLIN_GEOMETRY_CONTEXT_TOKEN_BENCHMARK_V0_1.json")
          d=json.loads(p.read_text())
          s=d["summary"]
          assert d["verdict"] == "PASS_CL100K_CONTEXT_PACK_TOKEN_REDUCTION"
          assert s["actual_tokenizer_accounting"] is True
          assert s["selected_packed_tokens"] < s["selected_naive_tokens"]
          assert s["actual_model_billing_accounting"] is False
          assert s["cross_tokenizer_generality_claim"] is False
          assert d["authority"]["canon_allowed"] is False
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gremlin-geometry-phase-scheduler-v01
          path: |
            provenance/GREMLIN_GEOMETRY_PHASE_SCHEDULER_BENCHMARK_V0_1.json
            provenance/GREMLIN_GEOMETRY_CONTEXT_TOKEN_BENCHMARK_V0_1.json
          if-no-files-found: error

name: GREMLIN Security Audit v0.1

on:
  pull_request:
    paths:
      - 'gremlin_mcp/**'
      - 'tools/**'
      - 'client/**'
      - 'examples/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'native/**'
      - 'spec/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'AI_TRAINING_POLICY.md'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'SECURITY.md'
  push:
    branches:
      - main
    paths:
      - 'gremlin_mcp/**'
      - 'tools/**'
      - 'client/**'
      - 'examples/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'native/**'
      - 'spec/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'AI_TRAINING_POLICY.md'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'SECURITY.md'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency auditor
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit project dependency graph against known vulnerabilities
        run: pip-audit --progress-spinner=off .
      - name: Resolve GREMLIN runtime dependencies with provenance report
        run: python -m pip install --disable-pip-version-check --report gremlin-runtime-dependency-report.json -e .
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Preserve exact dependency resolution receipt
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-runtime-dependency-report
          path: gremlin-runtime-dependency-report.json
          if-no-files-found: error
          retention-days: 30

  high-severity-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit
      - name: Fail on high-severity Python findings
        run: bandit -q -r gremlin_mcp tools client -lll -ii

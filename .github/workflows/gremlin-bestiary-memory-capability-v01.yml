name: GREMLIN Bestiary memory capability v0.1

on:
  pull_request:
    branches:
      - main
      - formalism/memory-consolidation-retention-v01-20260920
    paths:
      - 'gremlin_mcp/bestiary_memory_capability.py'
      - 'gremlin_mcp/core.py'
      - 'tests/test_bestiary_memory_capability_v01.py'
      - 'spec/GREMLIN_BESTIARY_MEMORY_CAPABILITY_V0_1.md'
      - '.github/workflows/gremlin-bestiary-memory-capability-v01.yml'

permissions:
  contents: read

jobs:
  bestiary-memory-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GREMLIN and pytest
        run: python -m pip install -e . pytest
      - name: Compile capability surfaces
        run: >-
          python -m py_compile
          gremlin_mcp/bestiary_memory_capability.py
          gremlin_mcp/core.py
      - name: Run focused memory capability tests
        run: python -m pytest -q tests/test_bestiary_memory_capability_v01.py

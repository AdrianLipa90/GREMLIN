name: GREMLIN semantic orbital RFC source density v0.4

on:
  push:
    branches:
      - feat/semantic-orbital-rfc-source-density-v0.4
  pull_request:
    branches:
      - feat/semantic-orbital-pnlf-radius-source-v0.3

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run RFC source-density bridge tests
        run: python -m pytest -q tests/test_gremlin_semantic_orbital_rfc_source_density_v04.py

name: GREMLIN Cognitive Action Principle v0.1

on:
  push:
    branches:
      - feat/cognitive-action-principle-v01-rebased
  pull_request:
    paths:
      - 'tools/gremlin_cognitive_action_principle_v01.py'
      - 'tests/test_gremlin_cognitive_action_principle_v01.py'
      - 'gremlin_mcp/orbital_hive_memory.py'
      - 'gremlin_mcp/hive_authority.py'
      - 'gremlin_mcp/raphael.py'
      - 'spec/GREMLIN_COGNITIVE_ACTION_PRINCIPLE_V0_1.md'
      - 'provenance/GREMLIN_COGNITIVE_ACTION_PRINCIPLE_V0_1.json'
      - '.github/workflows/gremlin-cognitive-action-principle-v01.yml'
  workflow_dispatch:

jobs:
  cognitive-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Compile cognitive action surface
        run: python -m py_compile tools/gremlin_cognitive_action_principle_v01.py
      - name: Run cognitive action and authority-adjacent tests
        run: |
          python -m pytest -q \
            tests/test_gremlin_cognitive_action_principle_v01.py \
            tests/test_native_pnv_contracts.py \
            tests/test_gremlin_orbital_hive_memory_v01.py \
            tests/test_gremlin_hive_authority_v02.py \
            tests/test_gremlin_raphael_v01.py

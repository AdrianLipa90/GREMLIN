name: GREMLIN development roadmap PDF

on:
  push:
    branches:
      - docs/gremlin-development-roadmap-v0.1
    paths:
      - "docs/roadmap/GREMLIN_DEVELOPMENT_ROADMAP_V0_1.md"
      - "tools/docs/build_gremlin_roadmap_pdf.py"
      - ".github/workflows/gremlin-development-roadmap-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gremlin-development-roadmap-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check mistune weasyprint
      - name: Build PDF
        run: python tools/docs/build_gremlin_roadmap_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/GREMLIN_DEVELOPMENT_ROADMAP_V0_1.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Render GREMLIN development roadmap v0.1 PDF"
            git push origin HEAD:docs/gremlin-development-roadmap-v0.1
          fi

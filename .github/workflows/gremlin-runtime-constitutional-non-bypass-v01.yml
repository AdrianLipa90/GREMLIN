name: GREMLIN Runtime Constitutional Non-Bypass v0.1

on:
  pull_request:
    paths:
      - 'gremlin_mcp/constitutional_runtime.py'
      - 'gremlin_mcp/constitutional_surface_registry.py'
      - 'gremlin_mcp/mathematical_constitution.py'
      - 'gremlin_mcp/hive_server.py'
      - 'gremlin_mcp/hive_authority_server.py'
      - 'gremlin_mcp/server_with_hive.py'
      - 'gremlin_mcp/bestiary_memory_gateway.py'
      - 'gremlin_mcp/raphael.py'
      - 'tools/gremlin_runtime_constitutional_proof_v01.py'
      - 'tests/test_gremlin_constitutional_runtime_v01.py'
      - 'tests/test_gremlin_runtime_constitutional_coverage_v01.py'
      - 'tests/test_gremlin_raphael_v01.py'
      - 'tests/test_native_pnv_contracts.py'
      - 'native/GREMLIN_RUNTIME_CONSTITUTIONAL_NON_BYPASS_V0_1.pnv'
      - 'native/GREMLIN_RAPHAEL_WISDOM_MUTATION_V0_1.pnv'
      - 'spec/GREMLIN_RUNTIME_CONSTITUTIONAL_NON_BYPASS_V0_1.md'
      - '.github/workflows/gremlin-runtime-constitutional-non-bypass-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'gremlin_mcp/constitutional_runtime.py'
      - 'gremlin_mcp/constitutional_surface_registry.py'
      - 'gremlin_mcp/mathematical_constitution.py'
      - 'gremlin_mcp/hive_server.py'
      - 'gremlin_mcp/hive_authority_server.py'
      - 'gremlin_mcp/server_with_hive.py'
      - 'gremlin_mcp/bestiary_memory_gateway.py'
      - 'gremlin_mcp/raphael.py'
      - 'tools/gremlin_runtime_constitutional_proof_v01.py'
      - 'tests/test_gremlin_constitutional_runtime_v01.py'
      - 'tests/test_gremlin_runtime_constitutional_coverage_v01.py'
      - 'tests/test_gremlin_raphael_v01.py'
      - 'tests/test_native_pnv_contracts.py'
      - 'native/GREMLIN_RUNTIME_CONSTITUTIONAL_NON_BYPASS_V0_1.pnv'
      - 'native/GREMLIN_RAPHAEL_WISDOM_MUTATION_V0_1.pnv'
      - 'spec/GREMLIN_RUNTIME_CONSTITUTIONAL_NON_BYPASS_V0_1.md'
      - '.github/workflows/gremlin-runtime-constitutional-non-bypass-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-constitutional-non-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GREMLIN focused test surface
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest numpy

      - name: Compile constitutional runtime surfaces
        run: >-
          python -m py_compile
          gremlin_mcp/constitutional_runtime.py
          gremlin_mcp/constitutional_surface_registry.py
          gremlin_mcp/mathematical_constitution.py
          gremlin_mcp/hive_server.py
          gremlin_mcp/hive_authority_server.py
          gremlin_mcp/server_with_hive.py
          gremlin_mcp/bestiary_memory_gateway.py
          gremlin_mcp/raphael.py
          tools/gremlin_runtime_constitutional_proof_v01.py

      - name: Run exact non-bypass proof
        run: python tools/gremlin_runtime_constitutional_proof_v01.py

      - name: Run focused runtime constitutional tests
        run: >-
          python -m pytest -q
          tests/test_gremlin_constitutional_runtime_v01.py
          tests/test_gremlin_runtime_constitutional_coverage_v01.py
          tests/test_gremlin_mathematical_constitution_v01.py
          tests/test_gremlin_raphael_v01.py
          tests/test_bestiary_memory_capabilities_v01.py
          tests/test_native_pnv_contracts.py

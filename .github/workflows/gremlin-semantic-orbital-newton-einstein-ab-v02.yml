name: GREMLIN semantic orbital Newton-Einstein-AB v0.2

on:
  push:
    branches:
      - feat/semantic-orbital-newton-einstein-ab-bridge-v0.2
  pull_request:
    paths:
      - 'spec/GREMLIN_SEMANTIC_ORBITAL_NEWTON_EINSTEIN_AB_BRIDGE_V0_2.md'
      - 'tools/gremlin_semantic_orbital_newton_einstein_ab_bridge_v02.py'
      - 'tests/test_gremlin_semantic_orbital_newton_einstein_ab_bridge_v02.py'
      - 'provenance/GREMLIN_SEMANTIC_ORBITAL_NEWTON_EINSTEIN_AB_LIVE_V0_2.json'
      - '.github/workflows/gremlin-semantic-orbital-newton-einstein-ab-v02.yml'

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Newton-Einstein-AB semantic orbital tests
        run: python -m pytest -q tests/test_gremlin_semantic_orbital_newton_einstein_ab_bridge_v02.py
